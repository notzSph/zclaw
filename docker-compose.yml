services:
  jayzoo-gateway:
    image: ${JAYZOO_IMAGE:-jayzoo:local}
    build:
      context: .
      args:
        JAYZOO_EXTENSIONS: ${JAYZOO_EXTENSIONS:-codex}
        JAYZOO_DOCKER_APT_PACKAGES: ${JAYZOO_DOCKER_APT_PACKAGES:-openssh-client}
        OPENCLAW_INSTALL_BROWSER: ${OPENCLAW_INSTALL_BROWSER:-1}
    env_file:
      - path: .env
        required: false
      - path: /opt/jayzoo-data/secrets/jayzoo.env
        required: true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      SSH_AUTH_SOCK: /run/ssh-agent

      JAYZOO_CONFIG_DIR: /home/node/.jayzoo
      JAYZOO_WORKSPACE_DIR: /home/node/.jayzoo/workspace

      OPENCLAW_AGENT_RUNTIME: pi
      JAYZOO_AGENT_RUNTIME: pi

      JAYZOO_ALLOW_INSECURE_PRIVATE_WS: ${JAYZOO_ALLOW_INSECURE_PRIVATE_WS:-}
      JAYZOO_DISABLE_BONJOUR: ${JAYZOO_DISABLE_BONJOUR:-}

      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-}
      JAYZOO_OTEL_PRELOADED: ${JAYZOO_OTEL_PRELOADED:-}

      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}

      TZ: ${JAYZOO_TZ:-UTC}

    volumes:
      - ${JAYZOO_CONFIG_DIR:-/opt/jayzoo-data}:/home/node/.jayzoo
      - ${JAYZOO_WORKSPACE_DIR:-/opt/jayzoo-data/workspace}:/home/node/.jayzoo/workspace
      - /opt/jayzoo/source:/work/jayzoo
      - /opt/jayzoo/runtime:/work/jayzoo-runtime
      - /opt/jayzoo-data/secrets/.env.wp:/run/secrets/.env.wp:ro
      - /opt/zrag:/work/zrag
      - /opt/jevzoo:/work/jevzoo
      - /home/zsph/Projects/zcrm:/work/zcrm
      - /home/zsph/Projects/ztrading:/work/ztrading
      - /home/zsph/Projects/zinsider:/work/zinsider
      - /home/zsph/Projects/zspinach:/work/zspinach
      - /home/zsph/Projects/znews:/work/znews
      - /home/zsph/Projects/zquotation:/work/zquotation
      - /home/zsph/Projects/afos:/work/afos
      - /home/zsph/Projects/3d-showroom:/work/3d-showroom
      - /home/zsph/Projects/logistics:/work/logistics
      - /home/zsph/Projects/forarts:/work/forarts

    cap_drop:
      - NET_RAW
      - NET_ADMIN

    security_opt:
      - no-new-privileges:true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "${JAYZOO_GATEWAY_PORT:-127.0.0.1:18789}:18789"
      - "${JAYZOO_BRIDGE_PORT:-127.0.0.1:18790}:18790"

    init: true
    restart: unless-stopped

    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${JAYZOO_GATEWAY_BIND:-loopback}",
        "--port",
        "18789",
      ]

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  jayzoo-cli:
    image: ${JAYZOO_IMAGE:-jayzoo:local}
    network_mode: "service:jayzoo-gateway"
    env_file:
      - path: .env
        required: false
      - path: /opt/jayzoo-data/secrets/jayzoo.env
        required: true

    environment:
      HOME: /home/node
      TERM: xterm-256color

      JAYZOO_CONFIG_DIR: /home/node/.jayzoo
      JAYZOO_WORKSPACE_DIR: /home/node/.jayzoo/workspace

      OPENCLAW_AGENT_RUNTIME: pi
      JAYZOO_AGENT_RUNTIME: pi

      JAYZOO_ALLOW_INSECURE_PRIVATE_WS: ${JAYZOO_ALLOW_INSECURE_PRIVATE_WS:-}

      BROWSER: echo

      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}

      TZ: ${JAYZOO_TZ:-UTC}

    volumes:
      - ${JAYZOO_CONFIG_DIR:-/opt/jayzoo-data}:/home/node/.jayzoo
      - ${JAYZOO_WORKSPACE_DIR:-/opt/jayzoo-data/workspace}:/home/node/.jayzoo/workspace
      - /opt/jayzoo/source:/work/jayzoo
      - /opt/jayzoo/runtime:/work/jayzoo-runtime
      - /opt/jayzoo-data/secrets/.env.wp:/run/secrets/.env.wp:ro
      - /opt/zrag:/work/zrag
      - /opt/jevzoo:/work/jevzoo
      - /home/zsph/Projects/zcrm:/work/zcrm
      - /home/zsph/Projects/ztrading:/work/ztrading
      - /home/zsph/Projects/zinsider:/work/zinsider
      - /home/zsph/Projects/zspinach:/work/zspinach
      - /home/zsph/Projects/znews:/work/znews
      - /home/zsph/Projects/zquotation:/work/zquotation
      - /home/zsph/Projects/afos:/work/afos
      - /home/zsph/Projects/3d-showroom:/work/3d-showroom
      - /home/zsph/Projects/logistics:/work/logistics
      - /home/zsph/Projects/forarts:/work/forarts
    
    cap_drop:
      - NET_RAW
      - NET_ADMIN

    security_opt:
      - no-new-privileges:true

    stdin_open: true
    tty: true
    init: true

    entrypoint: ["node", "dist/index.js"]

    depends_on:
      - jayzoo-gateway

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - searxng-config:/etc/searxng
      - searxng-cache:/var/cache/searxng
    ports:
      - "127.0.0.1:8888:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/search?q=health&format=json\", timeout=5)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  searxng-config:
  searxng-cache:
