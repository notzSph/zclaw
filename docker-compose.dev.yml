name: jayzoo-dev

services:
  jayzoo-dev-gateway:
    image: ${JAYZOO_DEV_IMAGE:-jayzoo:dev}
    build:
      context: .
      args:
        JAYZOO_EXTENSIONS: ${JAYZOO_EXTENSIONS:-codex}
        OPENCLAW_INSTALL_BROWSER: ${OPENCLAW_INSTALL_BROWSER:-1}
    env_file:
      - path: .env.dev
        required: false
      - path: ${JAYZOO_DEV_SECRETS_FILE:-/opt/jayzoo-dev-data/secrets/jayzoo.env}
        required: true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      JAYZOO_CONFIG_DIR: /home/node/.jayzoo
      JAYZOO_WORKSPACE_DIR: /home/node/.jayzoo/workspace
      OPENCLAW_AGENT_RUNTIME: pi
      JAYZOO_AGENT_RUNTIME: pi
      JAYZOO_ALLOW_INSECURE_PRIVATE_WS: ${JAYZOO_ALLOW_INSECURE_PRIVATE_WS:-}
      JAYZOO_DISABLE_BONJOUR: ${JAYZOO_DISABLE_BONJOUR:-1}
      TZ: ${JAYZOO_TZ:-UTC}
    volumes:
      - ${JAYZOO_DEV_CONFIG_DIR:-/opt/jayzoo-dev-data}:/home/node/.jayzoo
      - ${JAYZOO_DEV_WORKSPACE_DIR:-/opt/jayzoo-dev-data/workspace}:/home/node/.jayzoo/workspace
      - ${JAYZOO_DEV_SOURCE_DIR:-.}:/work/jayzoo
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${JAYZOO_DEV_GATEWAY_PORT:-127.0.0.1:19789}:18789"
      - "${JAYZOO_DEV_BRIDGE_PORT:-127.0.0.1:19790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${JAYZOO_GATEWAY_BIND:-loopback}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  jayzoo-dev-cli:
    image: ${JAYZOO_DEV_IMAGE:-jayzoo:dev}
    network_mode: "service:jayzoo-dev-gateway"
    env_file:
      - path: .env.dev
        required: false
      - path: ${JAYZOO_DEV_SECRETS_FILE:-/opt/jayzoo-dev-data/secrets/jayzoo.env}
        required: true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      JAYZOO_CONFIG_DIR: /home/node/.jayzoo
      JAYZOO_WORKSPACE_DIR: /home/node/.jayzoo/workspace
      OPENCLAW_AGENT_RUNTIME: pi
      JAYZOO_AGENT_RUNTIME: pi
      JAYZOO_ALLOW_INSECURE_PRIVATE_WS: ${JAYZOO_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      TZ: ${JAYZOO_TZ:-UTC}
    volumes:
      - ${JAYZOO_DEV_CONFIG_DIR:-/opt/jayzoo-dev-data}:/home/node/.jayzoo
      - ${JAYZOO_DEV_WORKSPACE_DIR:-/opt/jayzoo-dev-data/workspace}:/home/node/.jayzoo/workspace
      - ${JAYZOO_DEV_SOURCE_DIR:-.}:/work/jayzoo
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      jayzoo-dev-gateway:
        condition: service_healthy
